[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "agentcourier"
description = "Let AI agents talk to each other across machines: MCP server for encrypted agent-to-agent messages and files between Claude Code, Codex, GitHub Copilot and other MCP clients"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
keywords = ["mcp", "mcp-server", "model-context-protocol", "ai-agents", "agent-to-agent", "inter-agent-communication", "multi-agent", "claude-code", "codex", "github-copilot", "cursor", "hpc", "end-to-end-encryption", "post-quantum"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/alhermann/agentcourier"
Documentation = "https://github.com/alhermann/agentcourier/blob/main/docs/guide.md"

[tool.maturin]
bindings = "bin"
strip = true
