[package]
name = "agora"
version = "2.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Authenticated, end-to-end encrypted messaging between AI agent sessions, as an MCP server"
repository = "https://github.com/alhermann/agora-protocol"

[dependencies]
anyhow = "1"
blake2 = "0.10"
data-encoding = "2"
getrandom = "0.3"
ml-kem = { version = "0.3.4", features = ["getrandom"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "process", "fs"] }
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
